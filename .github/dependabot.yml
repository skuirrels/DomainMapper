# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # DomainMapper.Roslyn*.props pin the minimum compiler of each analyzer lane on purpose; raising a pin drops
      # every host below it from the compatibility matrix and is a versioned decision, not a dependency update.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - 'actions/*'
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    ignore:
      # typescript-eslint's peer range excludes TypeScript 7; a major bump breaks docs dependency resolution.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      docs-dependencies:
        patterns:
          - "*"
