name: benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/benchmark.yml'
      - 'src/**'
      - 'benchmarks/**'
      - 'global.json'
      - 'Directory.Build.props'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/benchmark.yml'
      - 'src/**'
      - 'benchmarks/**'
      - 'global.json'
      - 'Directory.Build.props'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  BENCHMARKS_PATH: 'benchmarks/DomainMap.Benchmarks'
  BENCHMARK_RESULT_DIR: 'benchmarks/DomainMap.Benchmarks/artifacts/results'
  BENCHMARK_REVERSED_RESULT_DIR: 'benchmarks/DomainMap.Benchmarks/artifacts/domainmap-first/results'
  BENCHMARK_BASELINE_DIR: './benchmark-results'
  BENCHMARK_BASELINE_FILE: './benchmark-results/benchmark-baseline-report.json'
  DOMAINMAP_MAX_MAPPERLY_TIME_RATIO: '1.25'
  DOMAINMAP_MAPPERLY_TIME_SLACK_NS: '1'
  DOMAINMAP_MAX_MAPPERLY_ALLOCATION_RATIO: '1.00'
  DOMAINMAP_MAPPERLY_ALLOCATION_SLACK_BYTES: '0'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        BENCHMARK_NAME:
          - MappingBenchmarks
          - ComparisonMappingBenchmarks
          - SourceGeneratorBenchmarks
    name: ${{ matrix.BENCHMARK_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
      - name: Run ${{ matrix.BENCHMARK_NAME }}
        working-directory: ${{ env.BENCHMARKS_PATH }}
        env:
          DOMAINMAP_BENCHMARK_ORDER: mapperly-first
          DOMAINMAP_BENCHMARK_ARTIFACTS: artifacts
        run: dotnet run --exporters json --configuration Release --filter '*.${{ matrix.BENCHMARK_NAME }}.*'
      - name: Run comparison with DomainMap first
        if: matrix.BENCHMARK_NAME == 'ComparisonMappingBenchmarks' || matrix.BENCHMARK_NAME == 'SourceGeneratorBenchmarks'
        working-directory: ${{ env.BENCHMARKS_PATH }}
        env:
          DOMAINMAP_BENCHMARK_ORDER: domainmap-first
          DOMAINMAP_BENCHMARK_ARTIFACTS: artifacts/domainmap-first
        run: dotnet run --exporters json --configuration Release --filter '*.${{ matrix.BENCHMARK_NAME }}.*'
      - name: Prove generated runtime parity
        if: matrix.BENCHMARK_NAME == 'ComparisonMappingBenchmarks'
        run: >-
          dotnet run --no-build --configuration Release
          --project ${{ env.BENCHMARKS_PATH }}/DomainMap.Benchmarks.csproj --
          --write-comparison-parity
          artifacts/obj/DomainMap.Benchmarks/release/generated/DomainMap/DomainMap.DomainMapGenerator/DomainMapBenchmarkMapper.g.cs
          artifacts/obj/DomainMap.Benchmarks/release/generated/Riok.Mapperly/Riok.Mapperly.MapperGenerator/MapperlyBenchmarkMapper.g.cs
          ${{ env.BENCHMARKS_PATH }}/ComparisonMappingBenchmarks.cs
          ${{ env.BENCHMARK_RESULT_DIR }}/DomainMap-vs-Mapperly-parity.json
      - name: Restore baseline results
        uses: actions/cache/restore@v5
        id: cache-baseline-results-restore
        with:
          path: ${{ env.BENCHMARK_BASELINE_DIR }}
          key: benchmarks-${{ matrix.BENCHMARK_NAME }}-main-${{ github.run_id }}
          restore-keys: |
            benchmarks-${{ matrix.BENCHMARK_NAME }}-main-
      - name: Enforce Mapperly parity
        if: matrix.BENCHMARK_NAME == 'ComparisonMappingBenchmarks'
        env:
          DOMAINMAP_MAPPERLY_PARITY_REPORT: ${{ env.BENCHMARK_RESULT_DIR }}/DomainMap-vs-Mapperly-parity.json
          DOMAINMAP_MAPPERLY_FASTER_SCENARIOS: '*'
          DOMAINMAP_MAPPERLY_MIN_REPORTS: '2'
          DOMAINMAP_MAPPERLY_MIN_SAMPLES: '6'
        run: >-
          dotnet run --no-build --configuration Release
          --project ${{ env.BENCHMARKS_PATH }}/DomainMap.Benchmarks.csproj --
          --check-comparison
          ${{ env.BENCHMARK_RESULT_DIR }}/DomainMap.Benchmarks.${{ matrix.BENCHMARK_NAME }}-report-full-compressed.json
          ${{ env.BENCHMARK_REVERSED_RESULT_DIR }}/DomainMap.Benchmarks.${{ matrix.BENCHMARK_NAME }}-report-full-compressed.json
      - name: Enforce Mapperly source-generator parity
        if: matrix.BENCHMARK_NAME == 'SourceGeneratorBenchmarks'
        env:
          DOMAINMAP_MAPPERLY_TIME_SLACK_NS: '0'
          DOMAINMAP_MAPPERLY_MIN_REPORTS: '2'
          DOMAINMAP_MAPPERLY_MIN_SAMPLES: '24'
          DOMAINMAP_MAX_MAPPERLY_ALLOCATION_RATIO: '1.10'
          DOMAINMAP_MAPPERLY_ALLOCATION_SLACK_BYTES: '0'
        run: >-
          dotnet run --no-build --configuration Release
          --project ${{ env.BENCHMARKS_PATH }}/DomainMap.Benchmarks.csproj --
          --check-comparison
          ${{ env.BENCHMARK_RESULT_DIR }}/DomainMap.Benchmarks.${{ matrix.BENCHMARK_NAME }}-report-full-compressed.json
          ${{ env.BENCHMARK_REVERSED_RESULT_DIR }}/DomainMap.Benchmarks.${{ matrix.BENCHMARK_NAME }}-report-full-compressed.json
      - name: Compare benchmark result
        uses: rhysd/github-action-benchmark@v1
        with:
          name: ${{ matrix.BENCHMARK_NAME }}
          tool: benchmarkdotnet
          external-data-json-path: ${{ env.BENCHMARK_BASELINE_FILE }}
          output-file-path: >-
            ${{ env.BENCHMARK_RESULT_DIR }}/DomainMap.Benchmarks.${{ matrix.BENCHMARK_NAME }}-report-full-compressed.json
          alert-threshold: '125%'
          fail-threshold: '125%'
          summary-always: true
          comment-on-alert: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          fail-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Store baseline results
        id: cache-baseline-results-save
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.BENCHMARK_BASELINE_DIR }}
          key: ${{ steps.cache-baseline-results-restore.outputs.cache-primary-key }}
      - name: Retain benchmark reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-${{ matrix.BENCHMARK_NAME }}
          path: ${{ env.BENCHMARKS_PATH }}/artifacts/**
          if-no-files-found: error
          retention-days: 90
