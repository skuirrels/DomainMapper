name: benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/benchmark.yml'
      - 'src/**'
      - 'benchmarks/**'
      - 'global.json'
      - 'Directory.Build.props'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/benchmark.yml'
      - 'src/**'
      - 'benchmarks/**'
      - 'global.json'
      - 'Directory.Build.props'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  BENCHMARKS_PATH: 'benchmarks/DomainMapper.Benchmarks'
  BENCHMARK_RESULT_DIR: 'benchmarks/DomainMapper.Benchmarks/artifacts/results'
  BENCHMARK_GENERATED_DIR: 'artifacts/obj/DomainMapper.Benchmarks/release/generated'
  BENCHMARK_REVERSED_RESULT_DIR: 'benchmarks/DomainMapper.Benchmarks/artifacts/domainmapper-first/results'
  BENCHMARK_BASELINE_DIR: './benchmark-results'
  BENCHMARK_BASELINE_FILE: './benchmark-results/benchmark-baseline-report.json'
  DOMAINMAPPER_MAX_MAPPERLY_TIME_RATIO: '1.25'
  DOMAINMAPPER_MAPPERLY_TIME_SLACK_NS: '1'
  DOMAINMAPPER_MAX_MAPPERLY_ALLOCATION_RATIO: '1.00'
  DOMAINMAPPER_MAPPERLY_ALLOCATION_SLACK_BYTES: '0'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        BENCHMARK_NAME:
          - ComparisonMappingBenchmarks
          - SourceGeneratorBenchmarks
    name: ${{ matrix.BENCHMARK_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
      - name: Run ${{ matrix.BENCHMARK_NAME }}
        working-directory: ${{ env.BENCHMARKS_PATH }}
        env:
          DOMAINMAPPER_BENCHMARK_ORDER: mapperly-first
          DOMAINMAPPER_BENCHMARK_ARTIFACTS: artifacts
        run: dotnet run --exporters json --configuration Release --filter '*.${{ matrix.BENCHMARK_NAME }}.*'
      - name: Run comparison with DomainMapper first
        if: matrix.BENCHMARK_NAME == 'ComparisonMappingBenchmarks' || matrix.BENCHMARK_NAME == 'SourceGeneratorBenchmarks'
        working-directory: ${{ env.BENCHMARKS_PATH }}
        env:
          DOMAINMAPPER_BENCHMARK_ORDER: domainmapper-first
          DOMAINMAPPER_BENCHMARK_ARTIFACTS: artifacts/domainmapper-first
        run: dotnet run --exporters json --configuration Release --filter '*.${{ matrix.BENCHMARK_NAME }}.*'
      - name: Prove generated runtime parity
        if: matrix.BENCHMARK_NAME == 'ComparisonMappingBenchmarks'
        run: >-
          dotnet run --no-build --configuration Release
          --project ${{ env.BENCHMARKS_PATH }}/DomainMapper.Benchmarks.csproj --
          --write-comparison-parity
          ${{ env.BENCHMARK_GENERATED_DIR }}/DomainMapper/DomainMapper.DomainMapperGenerator/*DomainMapperBenchmarkMapper*.g.cs
          ${{ env.BENCHMARK_GENERATED_DIR }}/Riok.Mapperly/Riok.Mapperly.MapperGenerator/MapperlyBenchmarkMapper.g.cs
          ${{ env.BENCHMARKS_PATH }}/ComparisonMappingBenchmarks.cs
          ${{ env.BENCHMARK_RESULT_DIR }}/DomainMapper-vs-Mapperly-parity.json
      - name: Restore baseline results
        uses: actions/cache/restore@v6
        id: cache-baseline-results-restore
        with:
          path: ${{ env.BENCHMARK_BASELINE_DIR }}
          key: benchmarks-${{ matrix.BENCHMARK_NAME }}-main-${{ github.run_id }}
          restore-keys: |
            benchmarks-${{ matrix.BENCHMARK_NAME }}-main-
      - name: Enforce Mapperly no-regression policy
        if: matrix.BENCHMARK_NAME == 'ComparisonMappingBenchmarks'
        env:
          DOMAINMAPPER_MAPPERLY_PARITY_REPORT: ${{ env.BENCHMARK_RESULT_DIR }}/DomainMapper-vs-Mapperly-parity.json
          DOMAINMAPPER_MAPPERLY_MIN_REPORTS: '2'
          DOMAINMAPPER_MAPPERLY_MIN_SAMPLES: '6'
        run: >-
          dotnet run --no-build --configuration Release
          --project ${{ env.BENCHMARKS_PATH }}/DomainMapper.Benchmarks.csproj --
          --check-comparison
          ${{ env.BENCHMARK_RESULT_DIR }}/DomainMapper.Benchmarks.${{ matrix.BENCHMARK_NAME }}-report-full-compressed.json
          ${{ env.BENCHMARK_REVERSED_RESULT_DIR }}/DomainMapper.Benchmarks.${{ matrix.BENCHMARK_NAME }}-report-full-compressed.json
      - name: Record hosted source-generator comparison
        if: matrix.BENCHMARK_NAME == 'SourceGeneratorBenchmarks'
        continue-on-error: true
        env:
          DOMAINMAPPER_MAPPERLY_TIME_SLACK_NS: '0'
          DOMAINMAPPER_MAPPERLY_MIN_REPORTS: '2'
          DOMAINMAPPER_MAPPERLY_MIN_SAMPLES: '24'
          DOMAINMAPPER_MAX_MAPPERLY_ALLOCATION_RATIO: '1.10'
          DOMAINMAPPER_MAPPERLY_ALLOCATION_SLACK_BYTES: '0'
        run: >-
          dotnet run --no-build --configuration Release
          --project ${{ env.BENCHMARKS_PATH }}/DomainMapper.Benchmarks.csproj --
          --check-comparison
          ${{ env.BENCHMARK_RESULT_DIR }}/DomainMapper.Benchmarks.${{ matrix.BENCHMARK_NAME }}-report-full-compressed.json
          ${{ env.BENCHMARK_REVERSED_RESULT_DIR }}/DomainMapper.Benchmarks.${{ matrix.BENCHMARK_NAME }}-report-full-compressed.json
      # Historical trend only. Absolute nanosecond timings drift between hosted runner generations, so this
      # comparison against the cached main baseline is informational; the paired same-run Mapperly gate above
      # is the failing check. Keeping this step green also lets the main baseline refresh on every run.
      - name: Record benchmark trend
        uses: rhysd/github-action-benchmark@v1
        with:
          name: ${{ matrix.BENCHMARK_NAME }}
          tool: benchmarkdotnet
          external-data-json-path: ${{ env.BENCHMARK_BASELINE_FILE }}
          output-file-path: >-
            ${{ env.BENCHMARK_RESULT_DIR }}/DomainMapper.Benchmarks.${{ matrix.BENCHMARK_NAME }}-report-full-compressed.json
          alert-threshold: '150%'
          summary-always: true
          comment-on-alert: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository
            && github.actor != 'dependabot[bot]' }}
          fail-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Store baseline results
        id: cache-baseline-results-save
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BENCHMARK_BASELINE_DIR }}
          key: ${{ steps.cache-baseline-results-restore.outputs.cache-primary-key }}
      - name: Retain benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.BENCHMARK_NAME }}
          path: ${{ env.BENCHMARKS_PATH }}/artifacts/**
          if-no-files-found: error
          retention-days: 90
