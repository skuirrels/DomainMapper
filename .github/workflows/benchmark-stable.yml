name: benchmark-stable

on:
  workflow_dispatch:

concurrency:
  group: benchmark-stable
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    name: Dedicated Linux performance gate
    runs-on: [self-hosted, linux, benchmark]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run stable balanced comparison
        env:
          DOMAINMAPPER_BENCHMARK_PAIRS: '6'
          DOMAINMAPPER_STABLE_RESULT_ROOT: ${{ runner.temp }}/domainmapper-stable
        run: ./scripts/run-stable-benchmarks.sh
      - name: Retain stable evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-stable-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/domainmapper-stable/**
          if-no-files-found: error
          retention-days: 90
