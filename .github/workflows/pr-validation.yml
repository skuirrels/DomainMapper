name: pr-validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - labeled
      - unlabeled

# A pull request opened with labels fires `opened` and `labeled` back to back. Cancelling the first run left a
# cancelled check-changelog-labels run on the head commit, which branch protection treated as a failed required
# check until it was rerun. The job takes seconds, so both runs complete instead.
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: false

jobs:
  check-changelog-labels:
    runs-on: ubuntu-latest
    steps:
      - name: PR has no changelog label
        if: |
          !contains(github.event.pull_request.labels.*.name, 'bug') &&
          !contains(github.event.pull_request.labels.*.name, 'enhancement') &&
          !contains(github.event.pull_request.labels.*.name, 'breaking-change') &&
          !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
          !contains(github.event.pull_request.labels.*.name, 'no-changelog') &&
          !contains(github.event.pull_request.labels.*.name, 'documentation')
        run: exit 1
      - name: PR has changelog label
        run: echo "ok :)"
