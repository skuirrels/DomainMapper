name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable release tag to publish"
        required: true
        type: string
  release:
    types:
      - published

# required secrets: CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN
env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NUGET_SOURCE: "https://api.nuget.org/v3/index.json"
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: ${{ github.workflow }}

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    environment: stable
    permissions:
      contents: write
      id-token: write
    outputs:
      version: ${{ steps.extract-version.outputs.RELEASE_VERSION }}
    steps:
      - name: checkout git
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - id: extract-version
        name: extract version
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag in the form v1.2.3, got: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: extract release notes
        id: extract-release-notes
        run: |
          {
            echo 'RELEASE_NOTES<<EOF';
            gh release view "$RELEASE_TAG" --json body --jq .body;
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: convert release notes markdown to text
        id: release-notes-text
        uses: koistya/strip-markdown@v1
        with:
          content: ${{ steps.extract-release-notes.outputs.RELEASE_NOTES }}
      - name: setup dotnet
        uses: actions/setup-dotnet@v5
      - name: install dependencies
        run: sudo apt update && sudo apt -y install zipmerge # zipmerge is used to merge the multi target nupkg
      - name: build release
        run: ./build/package.sh
        env:
          DOMAINMAPPER_ENVIRONMENT: stable
          RELEASE_NOTES: ${{ steps.release-notes-text.outputs.content }}
          RELEASE_VERSION: ${{ steps.extract-version.outputs.RELEASE_VERSION }}
      - name: authenticate with nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: skuirrels
      - name: publish nuget
        run: dotnet nuget push './artifacts/*.nupkg' --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY"
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      - name: add release assets
        run: gh release upload "$RELEASE_TAG" artifacts/*.nupkg
        env:
          GH_TOKEN: ${{ github.token }}
  docs:
    uses: ./.github/workflows/docs.yml
    needs: release
    with:
      deploy: true
      environment: stable
      version: ${{ needs.release.outputs.version }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
